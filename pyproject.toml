[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moocr"
version = "3.0.0"
description = "MO-OCR v3 — Arabic document intelligence with a model-agnostic evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "pydantic>=2.5",
    "rapidfuzz>=3.5",
    "tqdm>=4.65",
]

[project.optional-dependencies]
models = [
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.49",
    "easyocr>=1.7",
    "accelerate>=0.30",
]
dev = ["pytest>=7.0", "mypy>=1.8", "jiwer>=3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/moocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "jiwer>=4.0.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]
